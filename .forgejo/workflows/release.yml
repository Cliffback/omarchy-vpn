# Forgejo release. GitHub uses .github/workflows/release.yml (push mirror).
# Once .forgejo/workflows exists, Forgejo ignores .github/workflows — do not
# put softprops/action-gh-release here; that action is not mirrored.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to attach binaries to (e.g. v0.4.3)"
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build binaries
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION="${TAG#v}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "-s -w -X main.version=$VERSION" -o dist/omarchy-vpn-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags "-s -w -X main.version=$VERSION" -o dist/omarchy-vpn-linux-arm64 .
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Attach binaries
        env:
          FORGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          chmod +x .forgejo/upload-asset.sh
          .forgejo/upload-asset.sh dist/omarchy-vpn-linux-amd64
          .forgejo/upload-asset.sh dist/omarchy-vpn-linux-arm64
          .forgejo/upload-asset.sh dist/SHA256SUMS
