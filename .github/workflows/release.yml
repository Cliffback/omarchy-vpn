# GitHub only. Forgejo reads .forgejo/workflows/ and will not run this file
# (softprops/action-gh-release is not mirrored on data.forgejo.org).
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#v}"
          GOOS=linux GOARCH=amd64 go build -ldflags "-X main.version=$VERSION" -o dist/omarchy-vpn-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -ldflags "-X main.version=$VERSION" -o dist/omarchy-vpn-linux-arm64 .

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/omarchy-vpn-linux-amd64
            dist/omarchy-vpn-linux-arm64
